services:
  - type: web
    name: accessable-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /app/storage
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: N8N_WEBHOOK_URL
        sync: false
